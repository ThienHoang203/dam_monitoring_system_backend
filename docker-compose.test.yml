# Hạ tầng phụ trợ cho integration/e2e test.
# Cổng lệch với docker-compose.yml (5433 / 1884) để chạy song song với stack dev.
# Không mount volume — dữ liệu test luôn sạch sau khi `down`.

services:
  timescaledb-test:
    image: timescale/timescaledb:latest-pg16
    container_name: dam_timescaledb_test
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: dam_monitoring_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dam_monitoring_test"]
      interval: 3s
      timeout: 3s
      retries: 20

  mosquitto-test:
    image: eclipse-mosquitto:latest
    container_name: dam_mosquitto_test
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
